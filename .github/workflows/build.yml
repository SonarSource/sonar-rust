name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.95.0

jobs:
  macos_analyzers:
    runs-on: macos-latest
    name: macOS Analyzers Build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: write
    steps:
      # see https://xtranet-sonarsource.atlassian.net/wiki/spaces/Platform/pages/4412309510/MacOS+Runners+-+GitHub
      - name: Setup Cloudflare WARP
        uses: SonarSource/gh-action_setup-cloudflare-warp@v2.1.0
        id: warp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.18
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add x86_64-apple-darwin
      - uses: SonarSource/ci-github-actions/config-gradle@v2
      - name: Build Rust analyzers
        run: |
          echo "org.gradle.daemon=false" >> "gradle.properties"
          echo "org.gradle.vfs.watch=false" >> "gradle.properties"
          source $HOME/.cargo/env
          ./gradlew :analyzer:compileRustDarwin :analyzer:compileRustDarwinX86 --info --stacktrace
      - name: Upload Darwin ARM64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-aarch64-apple-darwin
          path: analyzer/target/aarch64-apple-darwin/release/analyzer.xz
      - name: Upload Darwin x86_64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-x86_64-apple-darwin
          path: analyzer/target/x86_64-apple-darwin/release/analyzer.xz

  cross_platform_analyzers:
    runs-on: warp-custom-ubuntu-24-04
    name: Cross-Platform Analyzers Build
    env:
      MUSL_CROSS_MAKE_COMMIT: 6f3701d08137496d5aac479e3a3977b5ae993c1f
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf build-essential gcc-mingw-w64 git libtool musl-dev musl-tools pkg-config rustup
          sudo apt-get clean
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.18
      - name: Cache cross-compiler
        id: cache-cross-compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cross-compiler-output
          key: musl-cross-compiler-aarch64-${{ env.MUSL_CROSS_MAKE_COMMIT }}
      - name: Build cross-compiler
        if: steps.cache-cross-compiler.outputs.cache-hit != 'true'
        env:
          MUSL_CROSS_MAKE_COMMIT: ${{ env.MUSL_CROSS_MAKE_COMMIT }}
        run: |
          # Build aarch64-linux-musl cross-compiler
          # This approach is based on https://github.com/cross-rs/cross/blob/main/docker/musl.sh
          git clone https://github.com/richfelker/musl-cross-make.git
          cd musl-cross-make
          # we checkout a specific commit to guarantee reproducibility (tags can be moved)
          git checkout $MUSL_CROSS_MAKE_COMMIT
          echo -e "TARGET = aarch64-linux-musl\nOUTPUT = $PWD/../cross-compiler-output\n" >> config.mak
          make
          make install
          cd ..
      - name: Install cross-compiler
        run: |
          # Install cross-compiler to system location
          # Warp runners use a restrictive sudo umask, so preserve executable permissions from the cache.
          sudo cp -r --preserve=mode cross-compiler-output/* /usr/local/
      - name: Setup Rust toolchain
        run: |
          # Setup Rust toolchain
          rustup default ${{ env.RUST_VERSION }}
          rustup component add llvm-tools rustfmt clippy
          cargo install cargo-llvm-cov

          # Add target platforms
          rustup target add x86_64-pc-windows-gnu
          rustup target add x86_64-unknown-linux-musl
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl
      - uses: SonarSource/ci-github-actions/config-gradle@v2
        with:
          repox-url: https://repox-internal.dev.sonar.build
      - name: Build Rust analyzers
        run: |
          ./gradlew :analyzer:compileRustLinuxMusl :analyzer:compileRustLinuxArm :analyzer:compileRustWin --info --stacktrace
      - name: Upload Linux x86_64 analyzer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-x86_64-unknown-linux-musl
          path: analyzer/target/x86_64-unknown-linux-musl/release/analyzer.xz
      - name: Upload Linux ARM64 analyzer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-aarch64-unknown-linux-musl
          path: analyzer/target/aarch64-unknown-linux-musl/release/analyzer.xz
      - name: Upload Windows analyzer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-x86_64-pc-windows-gnu
          path: analyzer/target/x86_64-pc-windows-gnu/release/analyzer.exe.xz

  unit_test_and_analysis:
    runs-on: sonar-m
    name: Unit Tests and Analysis
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.18
      - name: Setup Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get -y install rustup musl-tools
          sudo apt-get clean

          # Setup Rust toolchain (default target only)
          rustup default ${{ env.RUST_VERSION }}
          rustup component add llvm-tools rustfmt clippy
          rustup target add x86_64-unknown-linux-musl
          cargo install cargo-llvm-cov
      - uses: SonarSource/ci-github-actions/build-gradle@v2
        with:
          repox-url: https://repox-internal.dev.sonar.build
          deploy: false
          deploy-pull-request: false
          gradle-args: "-PskipCrossCompile --info --stacktrace"

  build:
    needs: [macos_analyzers, cross_platform_analyzers]
    if: |
      !cancelled() &&
      (needs.macos_analyzers.result == 'success' || needs.macos_analyzers.result == 'skipped') &&
      needs.cross_platform_analyzers.result == 'success'
    runs-on: sonar-m
    name: Build
    permissions:
      id-token: write
      contents: write
    outputs:
      BUILD_NUMBER: ${{ steps.build.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.18
      # Download Darwin artifacts (only if macos_analyzers job succeeded)
      - name: Download Darwin ARM64 artifact
        if: needs.macos_analyzers.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyzer-aarch64-apple-darwin
          path: analyzer/target/aarch64-apple-darwin/release/
      - name: Download Darwin x86_64 artifact
        if: needs.macos_analyzers.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyzer-x86_64-apple-darwin
          path: analyzer/target/x86_64-apple-darwin/release/
      # Download Linux/Windows artifacts (always built)
      - name: Download Linux x86_64 analyzer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyzer-x86_64-unknown-linux-musl
          path: analyzer/target/x86_64-unknown-linux-musl/release/
      - name: Download Linux ARM64 analyzer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyzer-aarch64-unknown-linux-musl
          path: analyzer/target/aarch64-unknown-linux-musl/release/
      - name: Download Windows analyzer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyzer-x86_64-pc-windows-gnu
          path: analyzer/target/x86_64-pc-windows-gnu/release/      
      - uses: SonarSource/ci-github-actions/build-gradle@v2
        id: build
        with:
          repox-url: https://repox-internal.dev.sonar.build
          deploy-pull-request: true
          gradle-args: "-PskipAnalyzerBuild --info --stacktrace"
          sonar-platform: 'none' # skip SQ analysis, it's done in analysis job
          skip-tests: true

  notify-build-failure:
    needs: [macos_analyzers, cross_platform_analyzers, build, unit_test_and_analysis, promote]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: sonar-xs
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}

  promote:
    needs: [build, unit_test_and_analysis]
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.unit_test_and_analysis.result == 'success'
    runs-on: sonar-xs
    name: Promote
    permissions:
      id-token: write
    steps:      
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true
