# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

group=org.sonarsource.rust
version=1.8.1-SNAPSHOT
description=Sonar Rust Analyzer
org.gradle.jvmargs=-XX:MetaspaceSize=4g -XX:MaxMetaspaceSize=4g -Xmx8g -Xms2g

# Repox has been intermittently timing out dependency resolution (SocketTimeoutException:
# Read timed out) under transient network/registry slowness, and Gradle's 30s default is too
# short to absorb it. Raise it to give resolution more room to complete instead of failing CI.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
